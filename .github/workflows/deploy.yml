name: CI/CD — CreatS4pY

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACK_IMAGE: ghcr.io/${{ github.repository_owner }}/creats4py-back
  FRONT_IMAGE: ghcr.io/${{ github.repository_owner }}/creats4py-front

jobs:

  # ══════════════════════════════════════════════════════
  # JOB 1 — Build & Push Backend
  # ══════════════════════════════════════════════════════
  build-back:
    name: 🔨 Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: ./creatyS4PY-api
        run: mvn test -q

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image (back)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./creatyS4PY-api
          file: ./creatyS4PY-api/Dockerfile.back
          push: true
          tags: |
            ${{ env.BACK_IMAGE }}:latest
            ${{ env.BACK_IMAGE }}:${{ github.sha }}

  # ══════════════════════════════════════════════════════
  # JOB 2 — Build & Push Frontend
  # ══════════════════════════════════════════════════════
  build-front:
    name: 🎨 Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./creatify-front/package-lock.json

      - name: Install dependencies
        working-directory: ./creatify-front
        run: npm ci

      - name: Build React app
        working-directory: ./creatify-front
        run: npm run build

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image (front)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./creatify-front
          file: ./creatify-front/Dockerfile.front
          push: true
          tags: |
            ${{ env.FRONT_IMAGE }}:latest
            ${{ env.FRONT_IMAGE }}:${{ github.sha }}

  # ══════════════════════════════════════════════════════
  # JOB 3 — Deploy sur le serveur (CT 100 Dockge)
  # ══════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy sur serveur
    runs-on: ubuntu-latest
    needs: [build-back, build-front]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/creats4py

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -f

            echo "✅ Déploiement terminé !"